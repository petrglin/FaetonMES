<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" rx="16" fill="#f0f5fb" stroke="none"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="960" height="64" rx="0" fill="#153655" stroke="none"/><text x="28" y="40" font-size="22" fill="white" font-weight="bold">FaetonMES</text><text x="730" y="38" font-size="15" fill="#b8cde0" font-weight="normal">Демонстрационный макет</text><text x="28" y="111" font-size="26" fill="#153655" font-weight="bold">Оперативное реагирование</text><text x="28" y="151" font-size="15" fill="#607185" font-weight="normal">Связь мониторинга, сервисных заказов и производственных ресурсов</text><rect x="28" y="188" width="904" height="66" rx="8" fill="#fff1ef" stroke="#ecc4bd"/><text x="48" y="216" font-size="18" fill="#9c342f" font-weight="bold">Событие: останов оборудования</text><text x="48" y="240" font-size="14" fill="#9c342f" font-weight="normal">Кромкооблицовочный станок · требуется техническая проверка</text><rect x="28" y="282" width="432" height="108" rx="8" fill="white" stroke="#dce5ee"/><rect x="44" y="300" width="36" height="32" rx="6" fill="#e7f1ff" stroke="none"/><text x="50" y="322" font-size="16" fill="#0059bd" font-weight="bold">01</text><text x="94" y="312" font-size="18" fill="#153655" font-weight="bold">Уведомление</text><text x="94" y="341" font-size="14" fill="#607185" font-weight="normal">Ответственные сотрудники</text><text x="94" y="364" font-size="14" fill="#607185" font-weight="normal">получают информацию о сбое</text><rect x="500" y="282" width="432" height="108" rx="8" fill="white" stroke="#dce5ee"/><rect x="516" y="300" width="36" height="32" rx="6" fill="#e7f1ff" stroke="none"/><text x="522" y="322" font-size="16" fill="#0059bd" font-weight="bold">02</text><text x="566" y="312" font-size="18" fill="#153655" font-weight="bold">Сервисный заказ</text><text x="566" y="341" font-size="14" fill="#607185" font-weight="normal">Обслуживание или ремонт</text><text x="566" y="364" font-size="14" fill="#607185" font-weight="normal">через взаимосвязанные модули</text><rect x="28" y="414" width="432" height="108" rx="8" fill="white" stroke="#dce5ee"/><rect x="44" y="432" width="36" height="32" rx="6" fill="#e7f1ff" stroke="none"/><text x="50" y="454" font-size="16" fill="#0059bd" font-weight="bold">03</text><text x="94" y="444" font-size="18" fill="#153655" font-weight="bold">Альтернативный процесс</text><text x="94" y="473" font-size="14" fill="#607185" font-weight="normal">Переключение на доступный</text><text x="94" y="496" font-size="14" fill="#607185" font-weight="normal">производственный процесс</text><rect x="500" y="414" width="432" height="108" rx="8" fill="white" stroke="#dce5ee"/><rect x="516" y="432" width="36" height="32" rx="6" fill="#e7f1ff" stroke="none"/><text x="522" y="454" font-size="16" fill="#0059bd" font-weight="bold">04</text><text x="566" y="444" font-size="18" fill="#153655" font-weight="bold">Подключение ресурсов</text><text x="566" y="473" font-size="14" fill="#607185" font-weight="normal">Ресурсы для продолжения</text><text x="566" y="496" font-size="14" fill="#607185" font-weight="normal">производства</text><text x="28" y="582" font-size="13" fill="#8593a3" font-weight="normal">Условные данные · не является снимком реальной системы</text></g></svg>