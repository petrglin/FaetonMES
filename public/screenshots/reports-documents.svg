<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" rx="16" fill="#f0f5fb" stroke="none"/><g font-family="Bahnschrift, Arial, sans-serif"><rect x="0" y="0" width="960" height="64" rx="0" fill="#153655" stroke="none"/><text x="28" y="40" font-size="22" fill="white" font-weight="normal">FaetonMES</text><text x="730" y="38" font-size="15" fill="#b8cde0" font-weight="normal">Демонстрационный макет</text><text x="28" y="111" font-size="26" fill="#153655" font-weight="normal">Отчёты и документы</text><text x="28" y="151" font-size="15" fill="#607185" font-weight="normal">Рабочие документы · автоматическая подача на печать</text><rect x="28" y="188" width="388" height="362" rx="8" fill="white" stroke="#dce5ee"/><text x="48" y="222" font-size="18" fill="#153655" font-weight="bold">Документы производства</text><rect x="44" y="244" width="356" height="76" rx="6" fill="#f0f5fb" stroke="none"/><text x="60" y="273" font-size="17" fill="#0059bd" font-weight="normal">Маршрутная карта</text><text x="60" y="298" font-size="14" fill="#607185" font-weight="normal">При запуске заказа</text><rect x="44" y="336" width="356" height="76" rx="6" fill="#f0f5fb" stroke="none"/><text x="60" y="365" font-size="17" fill="#0059bd" font-weight="normal">Сменное задание</text><text x="60" y="390" font-size="14" fill="#607185" font-weight="normal">К началу смены</text><rect x="44" y="428" width="356" height="76" rx="6" fill="#f0f5fb" stroke="none"/><text x="60" y="457" font-size="17" fill="#0059bd" font-weight="normal">Чертёж детали</text><text x="60" y="482" font-size="14" fill="#607185" font-weight="normal">На нужной операции</text><rect x="436" y="188" width="496" height="362" rx="8" fill="white" stroke="#dce5ee"/><text x="456" y="222" font-size="18" fill="#153655" font-weight="bold">Предпросмотр маршрутной карты</text><rect x="464" y="242" width="440" height="240" rx="3" fill="#fff" stroke="#dce5ee"/><text x="484" y="272" font-size="17" fill="#153655" font-weight="normal">Заказ ЗК-1042 · изделие 01</text><text x="484" y="303" font-size="14" fill="#607185" font-weight="normal">Деталь → операция → рабочий центр</text><path d="M464 324h440" fill="none" stroke="#dce5ee" stroke-width="1"/><text x="484" y="352" font-size="14" fill="#8593a3" font-weight="normal">01</text><text x="530" y="352" font-size="16" fill="#203146" font-weight="normal">Раскрой</text><path d="M464 370h440" fill="none" stroke="#dce5ee" stroke-width="1"/><text x="484" y="398" font-size="14" fill="#8593a3" font-weight="normal">02</text><text x="530" y="398" font-size="16" fill="#203146" font-weight="normal">Кромкооблицовка</text><path d="M464 416h440" fill="none" stroke="#dce5ee" stroke-width="1"/><text x="484" y="444" font-size="14" fill="#8593a3" font-weight="normal">03</text><text x="530" y="444" font-size="16" fill="#203146" font-weight="normal">Сверление</text><text x="456" y="522" font-size="15" fill="#0059bd" font-weight="normal">Формирование и печать в бизнес-процессе</text><text x="28" y="582" font-size="13" fill="#8593a3" font-weight="normal">Условные данные · не является снимком реальной системы</text></g></svg>