<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" rx="16" fill="#f0f5fb" stroke="none"/><g font-family="Bahnschrift, Arial, sans-serif"><rect x="0" y="0" width="960" height="64" rx="0" fill="#153655" stroke="none"/><text x="28" y="40" font-size="22" fill="white" font-weight="normal">FaetonMES</text><text x="730" y="38" font-size="15" fill="#b8cde0" font-weight="normal">Демонстрационный макет</text><text x="28" y="111" font-size="26" fill="#153655" font-weight="normal">Планирование обслуживания</text><text x="28" y="151" font-size="15" fill="#607185" font-weight="normal">Разовые и регулярные работы · требуемые материалы · исполнители</text><rect x="28" y="188" width="904" height="162" rx="8" fill="white" stroke="#dce5ee"/><text x="48" y="220" font-size="20" fill="#153655" font-weight="bold">План технического обслуживания</text><text x="48" y="252" font-size="13" fill="#607185" font-weight="normal">Ресурс</text><text x="390" y="252" font-size="13" fill="#607185" font-weight="normal">Задание</text><text x="726" y="252" font-size="13" fill="#607185" font-weight="normal">Ответственный</text><path d="M28 264h904" fill="none" stroke="#dce5ee"/><text x="48" y="290" font-size="16" fill="#203146" font-weight="normal">Обрабатывающий центр</text><text x="390" y="290" font-size="15" fill="#203146" font-weight="normal">Регулярное ТО</text><text x="726" y="290" font-size="15" fill="#203146" font-weight="normal">Специалист 1</text><path d="M28 304h904" fill="none" stroke="#dce5ee"/><text x="48" y="330" font-size="16" fill="#203146" font-weight="normal">Цеховой транспорт</text><text x="390" y="330" font-size="15" fill="#203146" font-weight="normal">Разовое обслуживание</text><text x="726" y="330" font-size="15" fill="#203146" font-weight="normal">Специалист 2</text><rect x="28" y="370" width="432" height="180" rx="8" fill="white" stroke="#dce5ee"/><text x="48" y="404" font-size="18" fill="#153655" font-w