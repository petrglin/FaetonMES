<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" rx="16" fill="#f0f5fb" stroke="none"/><g font-family="Bahnschrift, Arial, sans-serif"><rect x="0" y="0" width="960" height="64" rx="0" fill="#153655" stroke="none"/><text x="28" y="40" font-size="22" fill="white" font-weight="normal">FaetonMES</text><text x="730" y="38" font-size="15" fill="#b8cde0" font-weight="normal">Демонстрационный макет</text><text x="28" y="111" font-size="26" fill="#153655" font-weight="normal">Движение складских запасов</text><text x="28" y="151" font-size="15" fill="#607185" font-weight="normal">Перемещения внутри склада и между объектами</text><rect x="28" y="188" width="904" height="222" rx="8" fill="white" stroke="#dce5ee"/><text x="48" y="222" font-size="18" fill="#153655" font-weight="bold">Заказы на перемещение</text><text x="48" y="257" font-size="14" fill="#607185" font-weight="normal">Заказ</text><text x="204" y="257" font-size="14" fill="#607185" font-weight="normal">Откуда</text><text x="472" y="257" font-size="14" fill="#607185" font-weight="normal">Куда</text><text x="738" y="257" font-size="14" fill="#607185" font-weight="normal">Статус</text><path d="M28 274h904" fill="none" stroke="#dce5ee"/><text x="48" y="296" font-size="16" fill="#0059bd" font-weight="normal">ПМ-0128</text><text x="204" y="296" font-size="15" fill="#203146" font-weight="normal">Склад сырья</text><text x="472" y="296" font-size="15" fill="#203146" font-weight="normal">Участок раскроя</text><text x="738" y="296" font-size="15" fill="#0059bd" font-weight="normal">В работе</text><path d="M28 339h904" fill="none" stroke="#dce5ee"/><text x="48" y="361" font-size="16" fill="#0059bd" font-weight="normal">ПМ-0129</text><text x="204" y="361" font-size="15" fill="#203146" font-weight="normal">Буфер раскроя</text><text x="472" y="361" font-size="15" fill="#203146" font-weight="normal">Участок сверления</text><text x="738" y="361" font-siz